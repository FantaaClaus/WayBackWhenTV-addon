name: Build Rewind TV addon

on:
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"  # every 3 hours: fresh cable guide + channel links

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5

      # The Internet Archive catalog only needs rebuilding once a week.
      - id: week
        run: echo "key=rewind-$(date -u +%G-%V)-${{ hashFiles('build.mjs') }}" >> "$GITHUB_OUTPUT"
      - id: archive-cache
        uses: actions/cache@v4
        with:
          path: public-archive
          key: ${{ steps.week.outputs.key }}
      - if: steps.archive-cache.outputs.cache-hit != 'true'
        run: OUT_DIR=public-archive node build.mjs

      # Cable lineup + guide: every run.
      - run: |
          mkdir -p public
          cp -r public-archive/. public/
          PAGES_URL="${{ steps.pages.outputs.base_url }}" node build-cable.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
